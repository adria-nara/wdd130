<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário HTML e CSS</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>
<body>
    <main class="questionario">
        <header>
            <h1>Quiz sobre HTML e CSS</h1>
            <p>Teste seu conhecimento.</p>
        </header>

        <form class="formulario">
            <label for="q1">1. O que significa a sigla HTML?</label>
            <input type="text" id="q1" name="q1" required>
            <br>
            <label for="q2">2. Qual tag HTML é usada para criar um link (âncora)?</label>
            <textarea id="q2" name="q2" rows="3"></textarea>
            <br>
            <label for="q3">3. Qual tag HTML é utilizada para definir o título principal (de maior importância) de uma página?</label>
            <input type="number" name="q3" id="q3">
            <br>
            <label for="q4">4. Qual tag ou elemento deixa o texto em negrito?</label>
            <input type="number" name="q4" id="q4"> 
            <br>
            <select name="quantidade" id="quantidade">
               <option value="" selected disabled>Escolha a opção correta</option>
               <option value="1">"heading"</option>
               <option value="2">"h6"<option>
               <option value="3">"h1"</option>
               <option value="4">"tittle"</option>
            </select>
    


        </form>
        <br>


        <button type="submit">Enviar Questionário</button>



    </main>
    
</body>
</html>
